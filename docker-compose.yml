services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - sqlite_data:/data

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  sqlite_data:
